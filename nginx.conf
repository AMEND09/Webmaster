server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # HTML entry, fallback, and root files (PDFs): never cache. Every build
  # emits new hashed filenames, so a cached index.html would pin users to
  # the old release while local dev looks fine.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Vite emits hashed filenames — safe to cache aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
