server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # HTML entry and root files (PDFs): never cache. Every build emits new
  # hashed filenames, so a cached index.html would pin users to the old
  # release while local dev looks fine.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ @spa;
  }

  # SPA fallback: extensionless paths get index.html, but anything with a
  # file extension that isn't on disk is a real 404 — so deleted files
  # (and evicted hashed assets) can never resolve to the app shell.
  location @spa {
    add_header Cache-Control "no-cache";
    if ($request_uri ~ ^[^?]*\.[a-zA-Z0-9]+(\?.*)?$) { return 404; }
    rewrite ^ /index.html break;
  }

  # Vite emits hashed filenames — safe to cache aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
