<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:72px;box-sizing:border-box;display:flex;align-items:center;gap:28px;padding:0 32px;background:{{ paper }};border-bottom:2.5px solid {{ ink }};font-family:'Space Mono',monospace">
<div style="font-family:'Archivo Black',sans-serif;font-size:24px;background:#ff5a36;color:#fff;padding:1px 12px 4px;border:2.5px solid #111;box-shadow:3px 3px 0 #111;transform:rotate(-3deg);letter-spacing:-0.5px">learn<span style="color:#ffe14d">ai</span></div>
<div style="display:flex;gap:6px;flex:1">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="5"><div style="padding:6px 13px;font-size:12px;font-weight:700;background:{{ l.bg }};color:{{ l.fg }};border:2px solid {{ l.bd }};border-radius:999px;text-transform:uppercase;letter-spacing:.6px">{{ l.n }}</div></sc-for>
</div>
<div style="display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:2px solid {{ ink }};border-radius:999px;color:{{ ink }};font-size:12px;font-weight:700"><span style="background:#3a5bff;color:#fff;border-radius:999px;padding:2px 8px">LV 7</span>1,240 XP</div>
<div style="width:40px;height:40px;border-radius:50%;background:#ff9ecb;border:2.5px solid {{ ink }};display:grid;place-items:center;font-family:'Archivo Black',sans-serif;font-size:14px;color:#111">MA</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Map&quot;,&quot;Lessons&quot;,&quot;Detective&quot;,&quot;Badges&quot;,&quot;League&quot;,&quot;&quot;],&quot;default&quot;:&quot;Map&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;no&quot;,&quot;yes&quot;],&quot;default&quot;:&quot;no&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark === 'yes';
    const ink = dark ? '#f3eee3' : '#141414';
    const paper = dark ? '#18171c' : '#f3eee3';
    const active = this.props.active || '';
    const links = ['Map', 'Lessons', 'Detective', 'Badges', 'League'].map(n => n === active
      ? { n, bg: '#ffe14d', fg: '#111', bd: '#111' }
      : { n, bg: 'transparent', fg: ink, bd: 'transparent' });
    return { ink, paper, links };
  }
}
</script>
</body>
</html>
